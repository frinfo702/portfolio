<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 600 600" fill="none">
  <title>Kenichiro Goto logo</title>
  <defs>
    <linearGradient id="metal" x1="155" y1="83" x2="413" y2="505" gradientUnits="userSpaceOnUse">
      <stop stop-color="#555158"/>
      <stop offset=".25" stop-color="#1b191f"/>
      <stop offset=".55" stop-color="#393039"/>
      <stop offset=".8" stop-color="#171419"/>
      <stop offset="1" stop-color="#51414a"/>
    </linearGradient>
    <linearGradient id="inner-metal" x1="258" y1="160" x2="419" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#625a63"/>
      <stop offset=".25" stop-color="#29212a"/>
      <stop offset=".62" stop-color="#211b22"/>
      <stop offset=".84" stop-color="#69606a"/>
      <stop offset="1" stop-color="#33252f"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="halation" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <path id="outer" d="M398 94C262 35 77 169 92 340C109 514 369 592 514 408"/>
    <path id="inner" d="M245 219C314 129 421 108 434 211C452 343 387 437 286 421"/>
  </defs>
  <g stroke-linecap="butt" stroke-linejoin="round">
    <use href="#outer" stroke="#777079" stroke-width="33"/>
    <use href="#outer" stroke="url(#metal)" stroke-width="31"/>
    <use href="#inner" stroke="#6f626d" stroke-width="47"/>
    <use href="#inner" stroke="url(#inner-metal)" stroke-width="45"/>
    <g stroke="#ff172e" stroke-width="16" opacity=".6" filter="url(#glow)">
      <use href="#outer"/><use href="#inner" transform="translate(5 9)"/>
    </g>
    <g stroke="#ff2036" stroke-width="10" opacity=".8" filter="url(#halation)">
      <use href="#outer"/><use href="#inner" transform="translate(5 9)"/>
    </g>
    <g stroke="#fa1832" stroke-width="7">
      <use href="#outer"/><use href="#inner" transform="translate(5 9)"/>
    </g>
    <g stroke="#ff6970" stroke-width="2.5">
      <use href="#outer"/><use href="#inner" transform="translate(5 9)"/>
    </g>
  </g>
</svg>
